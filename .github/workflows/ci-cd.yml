name: CI/CD Pipeline

on:
  push:
    branches: [ release/1.0.0 ]
  pull_request:
    branches: [ release/1.0.0 ]
  workflow_dispatch:

defaults:
  run:
    working-directory: Code

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClinicManagement.sln

      - name: Build
        run: dotnet build src/ClinicManagement.Web/ClinicManagement.Web.csproj -c Release

      # - name: Test
      #   run: |
      #     dotnet test ClinicManagement.sln \
      #       --configuration Release \
      #       --no-build \
      #       --verbosity normal \
      #       --logger "trx;LogFileName=test-results.trx" \
      #       --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/*.trx

  deploy:
    needs: build-and-test
    if: |
      (github.ref == 'refs/heads/release/1.0.0' && success()) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish src/ClinicManagement.Web/ClinicManagement.Web.csproj \
            -c Release \
            -o ./publish

      - name: Sync files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Code/publish/"
          target: "/home/ec2-user/Hospital_Management/Hospital_Management-26/hms-publish/"
          rm: true

      - name: Restart application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            sudo systemctl restart hms.service
            sleep 2
            sudo systemctl is-active hms.service
